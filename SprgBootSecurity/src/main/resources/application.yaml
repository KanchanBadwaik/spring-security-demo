spring:
  application:
    name: SprgBootSecurity

  server:
    port: 9090

  datasource:
    url: jdbc:mysql://localhost:3306/SpringSecurityDemo
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
